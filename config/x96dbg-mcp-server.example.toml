# Template for one backend instance. The installer creates separate x32 and x64
# runtime files with distinct ports and one shared generated bearer token.
bind = "127.0.0.1"
port = 43164
bearer_token = "REPLACE_ME"
request_timeout_ms = 10000
mutation_timeout_ms = 30000
shutdown_timeout_ms = 10000
max_inflight = 8
max_header_count = 64
max_header_bytes = 32768
max_requests_per_second = 100
max_body_bytes = 1048576
max_output_bytes = 1048576
allowed_origins = []
