[workspace]
members = ["crates/server"]
resolver = "3"

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
too_many_lines = "allow"
