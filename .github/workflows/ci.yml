name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v0.0.0-beta
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install pinned x64dbg SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'x64dbg-pluginsdk.zip'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'x64dbg'
          Invoke-WebRequest `
            'https://github.com/x64dbg/x64dbg/releases/download/2026.05.27/x64dbg-pluginsdk.zip' `
            -OutFile $archive
          $pluginSdk = Join-Path $sdkRoot 'pluginsdk'
          Expand-Archive -LiteralPath $archive -DestinationPath $pluginSdk
          if (!(Test-Path -LiteralPath (Join-Path $pluginSdk '_plugins.h'))) {
            throw 'Pinned x64dbg SDK archive is invalid.'
          }
          "X64DBG_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch Rust dependencies
        shell: pwsh
        run: cargo fetch --locked

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-test.txt

      - name: Check Rust formatting, tests, and Clippy
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo test --offline --locked --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
          cargo clippy --offline --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }

      - name: Build debug server and run Python unit and HTTP tests
        shell: pwsh
        run: |
          $messages = & cargo build --offline --locked --bin x64dbg-mcp-server --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Debug server build failed.' }
          $manifest = [IO.Path]::GetFullPath('crates/server/Cargo.toml')
          $artifacts = @($messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object {
            $_.reason -ceq 'compiler-artifact' -and
            $_.target.name -ceq 'x64dbg-mcp-server' -and
            $_.target.kind -contains 'bin' -and !$_.profile.test -and
            $_.manifest_path -and [IO.Path]::GetFullPath($_.manifest_path) -ieq $manifest -and
            $_.executable
          })
          if ($artifacts.Count -ne 1) { throw 'Expected exactly one debug server executable artifact.' }
          if (!(Test-Path -LiteralPath $artifacts[0].executable -PathType Leaf)) {
            throw 'Debug server executable artifact is missing.'
          }
          python -m pytest tests/python --server-path $artifacts[0].executable --junitxml artifacts/pytest-ci.xml
          if ($LASTEXITCODE -ne 0) { throw 'Python unit/HTTP tests failed.' }

      - name: Upload Python JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: artifacts/pytest-ci.xml
          if-no-files-found: warn

      # Native CTest needs runtime DLLs absent from the SDK-only CI install.
      # Keep it in the local release gate; packaging still builds both plugins.
      - name: Build x86/x64 plugins and package
        shell: pwsh
        run: ./scripts/package.ps1 -X64dbgRoot $env:X64DBG_ROOT

      - name: Upload tagged release package
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: x64dbg-mcp-backend-0.0.0-beta
          path: dist/x64dbg-mcp-backend-0.0.0-beta.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG `
            './dist/x64dbg-mcp-backend-0.0.0-beta.zip#x64dbg-mcp-backend-0.0.0-beta.zip' `
            --verify-tag `
            --title 'x64dbg-mcp-backend 0.0.0-beta' `
            --prerelease --latest=false `
            --notes-from-tag
