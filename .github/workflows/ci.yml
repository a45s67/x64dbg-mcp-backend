name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install pinned x64dbg SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'x64dbg-pluginsdk.zip'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'x64dbg'
          Invoke-WebRequest `
            'https://github.com/x64dbg/x64dbg/releases/download/2026.05.27/x64dbg-pluginsdk.zip' `
            -OutFile $archive
          $pluginSdk = Join-Path $sdkRoot 'pluginsdk'
          Expand-Archive -LiteralPath $archive -DestinationPath $pluginSdk
          if (!(Test-Path -LiteralPath (Join-Path $pluginSdk '_plugins.h'))) {
            throw 'Pinned x64dbg SDK archive is invalid.'
          }
          "X64DBG_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch Rust dependencies
        shell: pwsh
        run: cargo fetch --locked

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload tagged release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: x64dbg-mcp-backend-0.1.0
          path: dist/x64dbg-mcp-backend-0.1.0.zip
          if-no-files-found: error
          compression-level: 0
